
<!DOCTYPE html>
<html>
<head>
	
	<!-- meta tags and title -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tic-Tac-Toe</title>

	<!-- external and internal CSS -->
	<link rel="stylesheet" href="styles.css" media="all">
    
    <!-- external and internal JavaScript -->
	<script src="scripts.js" defer></script>

</head>
<body>

	<main class="page">
		<h1>Tic-Tac-Toe</h1>

		<p id="currentPlayer">Current Player: <span>x</span></p>
		<p id="gameOutcome"></p>
	
		<section class="gameboard">
			<div class="cell" id="a1"></div>
			<div class="cell" id="a2"></div>
			<div class="cell" id="a3"></div>

			<div class="cell" id="b1"></div>
			<div class="cell" id="b2"></div>
			<div class="cell" id="b3"></div>
			
			<div class="cell" id="c1"></div>
			<div class="cell" id="c2"></div>
			<div class="cell" id="c3"></div>
		</section>

		<button id="replayButton">Play Again</button>

	</main>

</body>
</html>
